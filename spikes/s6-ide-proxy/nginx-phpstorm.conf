# The test bed's nginx config plus PHP_IDE_CONFIG on port 80, so PhpStorm
# matches the session to its "debug-claw-testbed" server without asking,
# and a longer read timeout so a paused request is not cut at 60 s.
# PHP 8.5, entry script in public/ under /var/www/html.
server {
    listen 80;
    root /var/www/html/public;

    # Resolve the PHP service on each request, so recreating it does not
    # leave nginx pointing at an old address.
    resolver 127.0.0.11 valid=10s;
    set $php php85:9000;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass $php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_IDE_CONFIG "serverName=debug-claw-testbed";
        # A paused request must outlive nginx's default 60 s read timeout.
        fastcgi_read_timeout 600s;
    }
}

# PHP 8.3, project root as the document root under /srv/app.
server {
    listen 81;
    root /srv/app;

    resolver 127.0.0.11 valid=10s;
    set $php php83:9000;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass $php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
